<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Our To-DO List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- User selection tab-->
         <div class="user-tabs">
            <button id="btn-dennie" class="active" onclick="switchUser('dennie')">dennie</button>
            <button id="btn-chennie" onclick="switchUser('chennie')">chennie</button>
         </div>

         <h2 id="current-user-title">dennie's</h2>

         <!-- Input To-do List -->
         <div class="input-section">
             <input type="text" id="todo-input" placeholder="what are you going to do today?">
             <button onclick="addTodo()">add</button>
            </div>
            
            <!-- Show to-do List-->
           <div class="todo-lists">
                <div class="section-title">Things from yesterday</div>
                <ul id="yesterday-list" class="todo-list yesterday"></ul>

                <!-- Thing to do today -->
                 <div class="section-title">Things to do today</div>
                 <ul id="today-list" class="todo-list"></ul>
           </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
